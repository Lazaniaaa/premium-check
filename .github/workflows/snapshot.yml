name: Daily snapshot

# Once a day, record what Premium Check showed: data/snapshots/YYYY-MM-DD.json and
# the AI-written note with its facts in data/reports/YYYY-MM-DD.json.
# The commit history of data/ is the public, tamper-evident journal.
on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch report (snapshot + validated note) from the live site
        run: |
          mkdir -p data/snapshots data/reports
          day=$(date -u +%F)
          site="https://premium-check-iota.vercel.app"
          for i in 1 2 3; do
            if curl -fsS --max-time 120 "$site/api/report?by=github-actions" -o /tmp/report.json \
               && jq -e '.schema == 1 and (.snapshot.btc.routes | length) > 0 and (.note.points | length) > 0' /tmp/report.json > /dev/null; then
              jq .snapshot /tmp/report.json > "data/snapshots/$day.json"
              jq 'del(.snapshot)' /tmp/report.json > "data/reports/$day.json"
              echo "saved snapshot and report for $day"
              exit 0
            fi
            echo "report attempt $i failed, retrying in 60s"; sleep 60
          done
          echo "report unavailable, saving snapshot only"
          curl -fsS --max-time 90 "$site/api/snapshot?by=github-actions" -o /tmp/snap.json
          jq -e '.schema == 1 and (.btc.routes | length) > 0' /tmp/snap.json > /dev/null
          jq . /tmp/snap.json > "data/snapshots/$day.json"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "snapshot: $(date -u +%F)"
          git push
